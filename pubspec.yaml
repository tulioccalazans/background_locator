name: background_locator_plus
description: A Flutter plugin to request the location even if the app is killed. Sending the location to a dart function in background, also provide a meter filter
version: 3.0.0
homepage: https://pub.dev/packages/background_locator_plus
repository: https://github.com/tulioccalazans/background_locator.git
issue_tracker: https://github.com/tulioccalazans/background_locator/issues
platforms:
  android:
  ios:


environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: yukams.app.background_locator_plus
        pluginClass: BackgroundLocatorPlugin
      ios:
        pluginClass: BackgroundLocatorPlugin
